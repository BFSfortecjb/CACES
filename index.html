<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Formation</title>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- jsPDF + autotable (génération des documents PDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- SheetJS (import/export Excel) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- QR code (évaluation stagiaire) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<!-- JSZip (téléchargement groupé des documents) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root { --primaire: #0a5c8a; --fond: #f4f6f8; --texte: #1c2b36; --bordure: #d7dee3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--fond); color: var(--texte); }
  header.app-header { background: var(--primaire); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  header.app-header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav.tabs { display: flex; gap: 4px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--bordure); overflow-x: auto; }
  nav.tabs button { border: none; background: none; padding: 12px 14px; font-size: 14px; cursor: pointer; color: #55636c; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button.actif { color: var(--primaire); border-bottom-color: var(--primaire); font-weight: 600; }
  .app-corps { display: flex; align-items: flex-start; }
  nav.menu-lateral { flex: 0 0 210px; width: 210px; background: #fff; border-right: 1px solid var(--bordure); padding: 10px 0; min-height: calc(100vh - 57px); }
  nav.menu-lateral button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 11px 18px; font-size: 14px; cursor: pointer; color: #55636c; border-left: 3px solid transparent; }
  nav.menu-lateral button .cat-icone { font-size: 16px; line-height: 1; }
  nav.menu-lateral button.actif { color: var(--primaire); background: #eaf3f9; border-left-color: var(--primaire); font-weight: 600; }
  nav.menu-lateral button:hover:not(.actif) { background: #f4f6f8; }
  .app-contenu { flex: 1; min-width: 0; }
  main#vue { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
  @media (max-width: 760px) {
    .app-corps { flex-direction: column; }
    nav.menu-lateral { width: 100%; flex-direction: row; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--bordure); padding: 4px; min-height: 0; }
    nav.menu-lateral button { width: auto; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 9px 14px; }
    nav.menu-lateral button.actif { border-left-color: transparent; border-bottom-color: var(--primaire); background: none; }
  }
  .carte { background: #fff; border: 1px solid var(--bordure); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--bordure); border-radius: 6px; width: 100%; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #55636c; }
  button.bouton { background: var(--primaire); color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  button.bouton:hover { opacity: .9; }
  .erreur { color: #b3261e; font-size: 13px; margin-top: 8px; }
  #debug-panel { position: fixed; bottom: 0; left: 0; right: 0; max-height: 30vh; overflow-y: auto; background: #1c2b36; color: #d7f0ff; font: 12px/1.4 ui-monospace, monospace; padding: 8px 12px; display: none; }
  footer.site-copyright { max-width: 640px; margin: 0 auto; padding: 16px 20px 24px; text-align: center; font-size: 11px; color: #464645; opacity: .7; line-height: 1.5; }
</style>
</head>
<body>

<header class="app-header">
  <div style="display:flex;align-items:center;gap:10px;">
    <img id="logo-organisation" style="display:none;height:32px;max-width:120px;object-fit:contain;background:#fff;border-radius:4px;padding:2px;">
    <h1 id="titre-organisation">Admin Formation</h1>
  </div>
  <div id="zone-utilisateur"></div>
</header>

<div class="app-corps">
  <nav class="menu-lateral" id="menu-lateral"></nav>
  <div class="app-contenu">
    <nav class="tabs" id="onglets"></nav>
    <main id="vue"></main>
  </div>
</div>

<div id="debug-panel"></div>

<footer class="site-copyright">
  Outil mis à disposition par SARL Prévisecours — © 2026 — Tous droits
  réservés. Copie, reproduction ou réutilisation interdites sans autorisation.
</footer>

<script src="grille_sst.js"></script>
<script src="passeport.js"></script>
<script src="envoi.js"></script>
<script src="espace_client_admin.js"></script>
<script src="rattachements.js"></script>
<script src="catalogue.js"></script>
<script src="familles.js"></script>
<script src="positionnement_donnees.js"></script>
<script src="positionnement.js"></script>
<script src="import_excel.js"></script>
<script src="clients.js"></script>
<script src="stagiaires.js"></script>
<script src="bpf.js"></script>
<script src="formateurs.js"></script>
<script src="dashboard_intervenants.js"></script>
<script src="dashboard_activite.js"></script>
<script src="synthese_sessions.js"></script>
<script src="organisation.js"></script>
<script src="app.js"></script>

</html>
